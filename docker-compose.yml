version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: carebridge_postgres
    environment:
      POSTGRES_DB: carebridge_ai
      POSTGRES_USER: carebridge_user
      POSTGRES_PASSWORD: carebridge_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - carebridge_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebridge_user -d carebridge_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carebridge_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - carebridge_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - NODE_ENV=production

  # Django Backend Application
  backend:
    build: .
    container_name: carebridge_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_NAME=carebridge_ai
      - DB_USER=carebridge_user
      - DB_PASSWORD=carebridge_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend
      - DEBUG=True
    networks:
      - carebridge_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker (for background tasks)
  celery:
    build: .
    container_name: carebridge_celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_NAME=carebridge_ai
      - DB_USER=carebridge_user
      - DB_PASSWORD=carebridge_password
      - DB_HOST=postgres
      - DB_PORT=5432
    networks:
      - carebridge_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  carebridge_network:
    driver: bridge